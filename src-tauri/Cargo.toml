[package]
name = "daily-bread"
version = "0.1.0"
description = "일용할 양식 - 매일 성경 묵상 기록"
authors = ["you"]
edition = "2021"

[lib]
name = "daily_bread_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
